services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-im-postgres
    environment:
      POSTGRES_DB: ai_im_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-im-network

  redis:
    image: redis:7-alpine
    container_name: ai-im-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-im-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ai-im-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - ai-im-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  ai-im-network:
    driver: bridge
