apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-im-config
  namespace: ai-im
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  RUST_LOG: "info"
  DATABASE_URL: "postgresql://prod_user:$(DB_PASSWORD)@postgres-service:5432/ai_im_prod"
  REDIS_URL: "redis://redis-service:6379"
  QDRANT_URL: "http://qdrant-service:6333"
