syntax = "proto3";

package chat;

import "google/protobuf/timestamp.proto";

// AI Agent personality configuration
message AIAgentPersona {
  optional string name = 1;
  optional string description = 2;
  optional int32 sarcasm_level = 3;
  optional int32 enthusiasm_level = 4;
  optional string expertise_domain = 5;
  optional string speech_pattern = 6;
  optional string response_style = 7;
  optional repeated string forbidden_topics = 8;
  optional repeated string preferred_topics = 9;
  optional int32 trigger_threshold = 10;
  optional bool enable_typing_simulation = 11;
  optional int32 typing_speed_wpm = 12;
  optional bool enable_multimodal = 13;
  optional string emotional_tone = 14;
  optional repeated string catchphrases = 15;
}