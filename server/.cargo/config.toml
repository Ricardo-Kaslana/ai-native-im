# Cargo configuration for faster builds and tests

[build]
# Use all available CPU cores for parallel compilation
jobs = -1

[target.x86_64-unknown-linux-gnu]
# Use faster linker (mold is fastest, lld is fallback)
# Uncomment the one you have installed:
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]  # Fastest (requires mold)
rustflags = ["-C", "link-arg=-fuse-ld=lld"]     # Fast (requires lld)

# Alternative: use default linker but with optimizations
# rustflags = ["-C", "link-arg=-Wl,--threads"]

[profile.dev]
# Faster compilation in dev mode
opt-level = 0
debug = 1  # Reduced debug info (0 = none, 1 = line tables, 2 = full)
incremental = true

[profile.test]
# Optimize test profile for faster execution
opt-level = 1  # Some optimization without slowing compilation too much
debug = 1      # Reduced debug info
incremental = true

# Optional: even faster tests with more optimization
# [profile.test]
# opt-level = 2
# debug = 0
# incremental = true
