# Nextest configuration for faster test execution
# Install with: cargo install cargo-nextest
# Run with: cargo nextest run

[profile.default]
# Run tests in parallel (default is number of CPUs)
test-threads = 0  # 0 = use all available cores

# Retry flaky tests
retries = 0

# Test execution settings
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "100ms"

# Show output for failed tests only
failure-output = "immediate"
success-output = "never"

# Status level
status-level = "pass"

[profile.ci]
# CI-specific settings
test-threads = 4
retries = 2
failure-output = "immediate-final"
success-output = "never"
